        summary: >
          Engineered a computer vision pipeline using YOLOv8 and Python to classify Pokemon card images, achieving high-accuracy inference on eBay listing images.
          Designed and implemented a web scraping pipeline to collect, preprocess, and label a custom training dataset for scalable data acquisition and improved model generalization.
        highlights:
          - Computer Vision and Object Detection
          - Data Collection and Preprocessing
          - Model Training and Evaluation
        end_date: 2025-05-01

      - name: DuqSchut Tutor Scheduling
        summary: >
          Collaborated in a 25-member Agile development team to build a full-stack tutor scheduling platform using .NET, Blazor, and Azure, delivering scalable CRUD functionality across front-end and back-end systems.
          Developed and maintained features using C#, Razor/HTML, and MVC architecture, applying SOLID design principles to ensure modularity, maintainability, and clean code practices.
        highlights:
          - Full-Stack Development
          - Agile Team Collaboration
          - MVC Architecture and SOLID Design
        end_date: 2025-05-01

